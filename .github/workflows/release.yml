name: Release

# Push a version tag by hand after bumping versionName and versionCode.
# This workflow signs the build and calls the same fastlane lane used locally.
on:
  push:
    tags:
      - "*-mg.*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Decode signing key
        run: |
          mkdir -p ~/.gradle
          echo "${{ secrets.KEYSTORE_SECRET }}" | base64 -d > ~/key.jks
          echo "AKANE_RELEASE_STORE_FILE=$(realpath ~/key.jks)" > ~/.gradle/gradle.properties
          echo "AKANE_RELEASE_STORE_PASSWORD=${{ secrets.KEYSTORE_PWD }}" >> ~/.gradle/gradle.properties
          echo "AKANE_RELEASE_KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> ~/.gradle/gradle.properties
          echo "AKANE_RELEASE_KEY_PASSWORD=${{ secrets.KEY_PWD }}" >> ~/.gradle/gradle.properties

      - name: Build release APK
        run: bundle exec fastlane android buildrel

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: MyGramophone ${{ github.ref_name }}
          # Keep this true until a tag should become /releases/latest.
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: app/build/outputs/apk/release/*.apk
          body: |
            Source for this build: https://github.com/${{ github.repository }}/tree/${{ github.ref_name }}

            This package uses the same application id as upstream Gramophone and a different signing key. Installing it requires uninstalling the official app first. App data does not carry over.
